name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 锁定 3.24.5：老插件与最新版 Flutter 的 Gradle 9 不兼容
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: 生成 Android 平台骨架
        run: |
          if [ ! -d android ]; then
            flutter create . --org com.example --project-name pan_video_player
          fi

      - name: 清理模板测试文件
        run: rm -rf test

      - name: 配置网络权限
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "android.permission.INTERNET" "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n<application#' "$MANIFEST"

      - run: flutter pub get

      - name: 静态检查 Dart 代码
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.log

      - name: 编译 APK
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build.log

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pan-video-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 失败时自动创建诊断报告
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 自动诊断报告 v2"
            echo ""
            echo "### 关键错误行（自动摘录）"
            echo '```'
            grep -n -E "FAILURE|What went wrong|Caused by|error:|Error:|Exception|FAILED|A problem occurred|Could not" build.log | head -n 80 || echo "(无匹配)"
            echo '```'
            echo ""
            echo "### 编译日志最后250行"
            echo '```'
            tail -n 250 build.log 2>/dev/null || echo "(无)"
            echo '```'
          } > issue_body.md
          gh issue create --title "APK构建失败·自动诊断v2" --body-file issue_body.md
